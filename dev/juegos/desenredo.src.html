<title>Desenredo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<style>
/*KIT_CSS*/
/* Layout: barra, dificultad, marcador, tablero que ocupa el resto, botonera (Deshacer 70 % · Reiniciar 30 %) */
:root{--board:#fbfbfc;--dot:rgba(0,0,0,.07);--line:#5a5d66;--cross:#e0483e;--nd:#22232a;--nd-bd:#fbfbfc;--on:#2f6fd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#1c1d21;--dot:rgba(255,255,255,.06);--line:#b4b6c0;--cross:#ff6a5f;--nd:#ececee;--nd-bd:#1c1d21;--on:#7fb2ff}}
:root[data-theme="dark"]{--board:#1c1d21;--dot:rgba(255,255,255,.06);--line:#b4b6c0;--cross:#ff6a5f;--nd:#ececee;--nd-bd:#1c1d21;--on:#7fb2ff}
.sc.bad b{color:var(--cross)}
.stage{border-radius:16px;overflow:hidden;background:var(--board);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);touch-action:none}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* líneas */
.eg line{stroke:var(--line);stroke-width:var(--lw,2.4);stroke-linecap:round;transition:stroke .15s}
.eg line.x{stroke:var(--cross)}
.eg line.hl{stroke-width:calc(var(--lw,2.4) + 1.2px)}
.solved .eg line{stroke:var(--ok)}
/* puntos */
.nd{cursor:grab}
.nd use{transform-box:fill-box;transform-origin:center;transition:transform .12s}
.nd.on use{transform:scale(1.28)}
.nd.nb use{transform:scale(1.1)}
.nd.kb .ring{stroke:var(--on);opacity:1;stroke-dasharray:4 3}
.nd .ring{fill:none;stroke:var(--cross);stroke-width:2.5;opacity:0}
.nd.hit .ring{opacity:.9}
.nd .ring{transform-box:fill-box;transform-origin:center}
.nd.hint .ring{stroke:var(--on);opacity:1;stroke-width:3;animation:hintP .6s ease-in-out 4 alternate}
@keyframes hintP{from{transform:scale(1)}to{transform:scale(1.6)}}
.pal .pv{background:var(--board)}
.pv.t-cielo{background:radial-gradient(ellipse at 30% 20%,#25306a,#0d1330 70%)}
/* ---------- temas ---------- */
.t-cielo{--board:#0d1330;--line:rgba(176,204,255,.75);--cross:#ff6b8a;--ok:#ffd36b;--on:#8fd3ff;--lw:1.8}
.t-cielo.stage{background:radial-gradient(ellipse at 30% 20%,#25306a,#0d1330 60%,#070a1c)}
.t-cielo.solved .eg line{filter:drop-shadow(0 0 3px rgba(255,211,107,.8))}
.t-costura{--board:#efe3cc;--line:#3b6ea8;--cross:#d23a3a;--ok:#2e8b57;--on:#7a3fa0;--lw:2.6}
.t-costura.stage::before{background:repeating-linear-gradient(0deg,rgba(120,90,50,.07) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(120,90,50,.07) 0 1px,transparent 1px 4px)}
.t-costura .eg line{stroke-dasharray:7 4}
.t-circuito{--board:#0f4d2e;--line:#d9a441;--cross:#ff5a4d;--ok:#ffe08a;--on:#7fffd4;--lw:3.4}
.t-circuito.stage::before{background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/24px 24px}
.t-circuito.solved .eg line{stroke-dasharray:10 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.t-metro{--board:#f4f1ea;--line:#8a8a8a;--cross:#9a9a9a;--ok:#2e9e5b;--on:#111;--lw:5}
.t-metro.stage::before{background:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px) 0 0/48px 48px}
.t-metro .eg line{stroke:var(--c)}
.t-metro .eg line.x{stroke:#9a9a9a;stroke-dasharray:5 6;stroke-width:3.4}
.t-metro.solved .eg line{stroke:var(--c)}
@media (prefers-reduced-motion:reduce){.nd use{transition:none}.nd.hint .ring{animation:none}.t-circuito.solved .eg line{animation:none}}
/* Píxel */
.t-pixel{--board:#1a1c2c;--line:#41a6f6;--cross:#b13e53;--on:#a7f070}
.t-pixel .eg line{stroke-linecap:square;--lw:3}
</style>

<div class="app">
<!--KIT_BAR-->
  <div class="hud">
    <div class="sc"><small>nivel</small><b id="lvl">1</b></div>
    <div class="sc" id="crossBox"><small>cruces</small><b id="cross">0</b></div>
    <div class="sc" id="movesBox"><small>movidas</small><b id="moves">0</b></div>
    <div class="sc" id="timeBox"><small>tiempo</small><b id="time">0:00</b></div>
    <button class="sc" id="hintBtn" aria-label="Pista: marcar el punto más enredado"><small>pista</small><b>💡</b></button>
  </div>
  <div class="stage" id="stage" aria-label="Tablero: arrastrá los puntos hasta que ninguna línea se cruce">
    <svg id="svg"><defs id="defs"></defs><g class="eg" id="edges"></g><g id="nodes"></g></svg>
  </div>
  <nav class="bottom">
    <button class="bb" id="act"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="actTxt">Deshacer</span></button>
    <button class="bb" id="restart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>Reiniciar</button>
  </nav>
</div>
<!--KIT_SHEETS-->

<script>
/*KIT_JS*/
/*GEN*/
/*END_GEN*/
/* ---------- temas: cambian el fondo, las líneas y la forma de los puntos ---------- */
// cada punto es un símbolo de 20×20 centrado en 0,0; "currentColor" toma el color de cada punto
const THEMES={
  clasico:{name:'Clásico',cls:'',sym:'<circle r="7.5" fill="var(--nd)" stroke="var(--nd-bd)" stroke-width="2.5"/>',cols:null},
  cielo:{fondo:{"p":[["estrellas",["#fff4cf","#ffffff"]]]},name:'Constelación',cls:'t-cielo',sym:'<circle r="8" fill="rgba(255,236,170,.22)"/><path d="M0-9Q1.2-1.2 9 0Q1.2 1.2 0 9Q-1.2 1.2-9 0Q-1.2-1.2 0-9z" fill="#fff4cf"/><circle r="2.2" fill="#fff"/>',cols:null},
  costura:{name:'Botones',cls:'t-costura',sym:'<circle r="8.6" fill="currentColor" stroke="rgba(0,0,0,.35)" stroke-width="1"/><circle r="6" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1"/><g fill="rgba(0,0,0,.45)"><circle cx="-2.1" cy="-2.1" r="1.25"/><circle cx="2.1" cy="-2.1" r="1.25"/><circle cx="-2.1" cy="2.1" r="1.25"/><circle cx="2.1" cy="2.1" r="1.25"/></g>',
    cols:['#e85d75','#f2a33a','#4aa3df','#7bc96f','#a77bd6','#f06ab0','#3fbfb0','#e0c341']},
  circuito:{fondo:{"p":[["grilla",["rgba(217,164,65,.22)","#ffe08a"]]]},name:'Circuito',cls:'t-circuito',sym:'<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#c98f2e" stroke="#ffe0a0" stroke-width="1.2"/><circle r="3.4" fill="#0a2e1b"/><circle r="5.6" fill="none" stroke="#f3c56a" stroke-width="1"/>',cols:null},
  metro:{fondo:{"p":[["luz",["rgba(0,0,0,.04)"]],["polvo",["#8a8a8a"],0.3]]},name:'Metro',cls:'t-metro',sym:'<circle r="7.6" fill="#fff" stroke="#1d1d1f" stroke-width="3.2"/>',cols:null,lineCols:['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b','#d81b60','#6d4c41']}/*PX*/,
  pixel:{name:'Píxel',cls:'t-pixel',pixel:true,fondo:Pixel.FONDO,sym:'<g shape-rendering="crispEdges"><rect x="-8" y="-8" width="16" height="16" fill="#1a1c2c"/><rect x="-6" y="-6" width="12" height="12" fill="#ffcd75"/><rect x="-6" y="-6" width="12" height="3" fill="#fff6d8"/><rect x="-6" y="3" width="12" height="3" fill="#ef7d57"/></g>',cols:null}/*FIN_PX*/
};
// S: {lvl, n, E, P (posiciones 0..1), start, moves, secs, undo:[[i,x,y]], won, timeup}

/* ---------- tablero: coordenadas, dibujo y conflictos ---------- */
let W=0,H=0,PAD=24,R=10,nodeEls=[],edgeEls=[],hl=-1,sel=-1,info={x:[],k:0,hit:[]};
const px=p=>[PAD+p[0]*(W-2*PAD),PAD+p[1]*(H-2*PAD)];
const norm=(x,y)=>[clamp((x-PAD)/(W-2*PAD),0,1),clamp((y-PAD)/(H-2*PAD),0,1)];
function measure(){const r=$('stage').getBoundingClientRect();W=r.width;H=r.height;
  R=Math.max(9,Math.min(15,Math.min(W,H)*(S&&S.n>16?.026:.034)));PAD=R+8;$('svg').style.setProperty('--r',R+'px');}
function build(){
  measure();
  $('edges').innerHTML=S.E.map((e,i)=>`<line data-e="${i}"/>`).join('');
  $('nodes').innerHTML=S.P.map((p,i)=>`<g class="nd" data-n="${i}"><circle class="ring" r="${R*1.5}"/><use href="#ndSym" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}"/></g>`).join('');
  edgeEls=[...$('edges').children];nodeEls=[...$('nodes').children];colorize();draw();
}
// colores por punto o por línea según el tema (sin rehacer el tablero)
function colorize(){const t=THEMES[themeKey];
  nodeEls.forEach((g,i)=>t.cols?g.setAttribute('color',t.cols[i%t.cols.length]):g.removeAttribute('color'));
  edgeEls.forEach((l,i)=>l.style.setProperty('--c',t.lineCols?t.lineCols[i%t.lineCols.length]:''));}
function placeNode(i){const [x,y]=px(S.P[i]);nodeEls[i].setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);}
function placeEdge(i){const [a,b]=S.E[i],[x1,y1]=px(S.P[a]),[x2,y2]=px(S.P[b]),l=edgeEls[i];l.setAttribute('x1',x1.toFixed(1));l.setAttribute('y1',y1.toFixed(1));l.setAttribute('x2',x2.toFixed(1));l.setAttribute('y2',y2.toFixed(1));}
// las líneas de cada punto, para mover sólo lo que cambia al arrastrar
let adj=null;
function edgesOf(v){if(!adj||adj.n!==S.n||adj.E!==S.E){adj=Array.from({length:S.n},()=>[]);S.E.forEach(([a,b],k)=>{adj[a].push(k);adj[b].push(k);});adj.n=S.n;adj.E=S.E;}return adj[v];}
function moveNode(i){placeNode(i);edgesOf(i).forEach(placeEdge);}
// conflictos: líneas que se cruzan y líneas que pasan por encima de un punto (medido en pantalla)
function analyze(){
  const Q=S.P.map(px),E=S.E,x=new Uint8Array(E.length),hit=new Uint8Array(S.n);let k=0;
  for(let i=0;i<E.length;i++){const [a,b]=E[i];for(let j=i+1;j<E.length;j++){const [c,d]=E[j];if(a===c||a===d||b===c||b===d)continue;if(segX(Q[a],Q[b],Q[c],Q[d])){x[i]=x[j]=1;k++;}}}
  const lim=R*.85;
  for(let i=0;i<E.length;i++){const [a,b]=E[i],A=Q[a],B=Q[b],dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy||1;
    for(let v=0;v<S.n;v++){if(v===a||v===b)continue;const p=Q[v];let t=((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L2;if(t<=0||t>=1)continue;
      if(Math.hypot(A[0]+t*dx-p[0],A[1]+t*dy-p[1])<lim){x[i]=1;hit[v]=1;k++;}}}
  // dos puntos encimados también cuentan
  for(let a=0;a<S.n;a++)for(let b=a+1;b<S.n;b++)if(Math.hypot(Q[a][0]-Q[b][0],Q[a][1]-Q[b][1])<R*1.2){hit[a]=hit[b]=1;k++;}
  info={x,k,hit};
}
function paint(){
  const f=hl>=0?hl:sel;
  edgeEls.forEach((l,i)=>{const c=info.x[i]?'x':'',h=f>=0&&(S.E[i][0]===f||S.E[i][1]===f)?' hl':'';const cls=c+h;if(l._c!==cls){l.setAttribute('class',cls);l._c=cls;}});
  const nbs=new Set();if(f>=0)S.E.forEach(([a,b])=>{if(a===f)nbs.add(b);if(b===f)nbs.add(a);});
  nodeEls.forEach((g,i)=>{const cls='nd'+(i===f?' on':nbs.has(i)?' nb':'')+(i===sel&&hl<0?' kb':'')+(info.hit[i]?' hit':'');if(g._c!==cls){g.setAttribute('class',cls);g._c=cls;}});
  $('cross').textContent=info.k;$('moves').textContent=S.moves;
  $('crossBox').className='sc'+(info.k?' bad':' good');
  $('stage').classList.toggle('solved',!!S.won);
  paintCommon();
}
// todo: posiciones, conflictos y marcador (al cargar, deshacer o reiniciar)
function draw(){S.P.forEach((_,i)=>placeNode(i));S.E.forEach((_,i)=>placeEdge(i));analyze();paint();}

/* ---------- arrastrar puntos ---------- */
Input.drag($('svg'),{
  start(pt){if(!S||S.won||S.timeup)return false;
    // el punto más cercano dentro de un área cómoda para el dedo
    let best=-1,bd=Math.max(26,R*2.2);S.P.forEach((p,i)=>{const [a,b]=px(p),d=Math.hypot(a-pt.x,b-pt.y);if(d<bd){bd=d;best=i;}});
    if(best<0)return false;const [nx,ny]=px(S.P[best]);hl=best;sel=-1;paint();return {i:best,from:S.P[best].slice(),ox:nx-pt.x,oy:ny-pt.y};},
  move(d,pt){S.P[d.i]=norm(pt.x+d.ox,pt.y+d.oy);moveNode(d.i);analyze();paint();},
  end(d,pt,{moved}){hl=-1;if(moved){pushUndo([d.i,...d.from]);S.moves++;afterMove(d.i);}else paint();}
});
let lastK=-1;
function afterMove(i){moveNode(i);const before=info.k;analyze();paint();save();
  if(info.k===0){celebrate();win();}else Sfx.play(info.k<before?'place':'tap');}
function celebrate(){if(!reduceMotion)nodeEls.forEach((g,i)=>g.querySelector('use').animate([{transform:'scale(1)'},{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:420,delay:i*25,easing:EASE}));}

/* ---------- pista y teclado ---------- */
function hint(){
  let best=-1,bv=0;const cnt=Array(S.n).fill(0);
  const Q=S.P.map(px);S.E.forEach(([a,b],i)=>{S.E.forEach(([c,d],j)=>{if(j<=i||a===c||a===d||b===c||b===d)return;if(segX(Q[a],Q[b],Q[c],Q[d])){cnt[a]++;cnt[b]++;cnt[c]++;cnt[d]++;}});});
  info.hit.forEach((h,i)=>{if(h)cnt[i]+=2;});cnt.forEach((v,i)=>{if(v>bv){bv=v;best=i;}});
  if(best<0){toast('No hay cruces');return;}
  const g=nodeEls[best];g.classList.remove('hint');void g.getBoundingClientRect();g.classList.add('hint');setTimeout(()=>{g.classList.remove('hint');g._c=null;paint();},2200);
  sel=best;toast('Probá moviendo este punto');
}
// Tab elige punto (el más enredado primero); flechas lo mueven (Shift: pasos largos). Cada punto movido con teclado es una sola jugada para deshacer.
let kbFrom=null;
function kbSelect(dir){if(!S||S.won)return;kbEnd();const n=S.n;sel=sel<0?(dir>0?0:n-1):(sel+dir+n)%n;paint();}
function kbEnd(){if(kbFrom){pushUndo(kbFrom);S.moves++;kbFrom=null;}}
function kbMove(dx,dy,e){if(!S||S.won||S.timeup)return;if(sel<0){sel=0;paint();return;}
  if(!kbFrom)kbFrom=[sel,...S.P[sel]];const st=(e&&e.shiftKey?.08:.02);S.P[sel]=[clamp(S.P[sel][0]+dx*st,0,1),clamp(S.P[sel][1]+dy*st,0,1)];
  moveNode(sel);analyze();paint();if(info.k===0){const i=sel;kbEnd();sel=-1;afterMove(i);}}
kitStart({
  id:'desenredo',diffs:DIFFS.map(d=>({name:d.name,par:Math.round(d.time*.35)})),themes:THEMES,theme:'clasico',
  help:`<p>Los puntos están unidos por líneas que se cruzan. Arrastrá los puntos hasta que <b>ninguna línea cruce a otra</b> ni pase por encima de un punto. Las líneas en conflicto se marcan; cuando no queda ninguna, el nivel está resuelto.</p>
<p>Todos los niveles tienen solución: salen de un dibujo sin cruces que después se desarma.</p>
<p><b>Dificultad:</b> sube con la cantidad de puntos y con cuántas líneas tiene cada uno. Con pocas líneas hay muchas formas de desenredar; con muchas, casi todo queda atado y hay que encontrar el dibujo justo.</p>
<p><b>Libre:</b> sin reloj, con pistas que marcan el punto más enredado. <b>Desafío:</b> contra reloj; ganás de 1 a 3 estrellas según el tiempo que te sobre.</p>`,
  keysHelp:'<b>Tab</b> elige un punto y las flechas lo mueven (con <b>Shift</b>, más rápido)',
  create(d,lvl){const L=genLevel(d,lvl);sel=-1;kbFrom=null;return {n:L.n,E:L.E,P:L.start.map(p=>p.slice()),start:L.start,moves:0};},
  reset(S){S.P=S.start.map(p=>p.slice());S.moves=0;sel=-1;kbFrom=null;},
  valid:s=>s.E&&s.P&&s.P.length===s.n,
  build,draw,busy:s=>s.moves>0,
  undo(u){kbFrom=null;S.P[u[0]]=[u[1],u[2]];},hint,
  applyTheme(k){const t=THEMES[k];$('stage').className='stage '+t.cls+(S&&S.won?' solved':'');
    $('defs').innerHTML=`<symbol id="ndSym" viewBox="-10 -10 20 20" overflow="visible">${t.sym}</symbol>`;if(nodeEls.length)colorize();},
  preview(k,t){const pts=[[22,40],[60,14],[98,40],[60,48]],ed=[[0,1],[1,2],[0,2],[1,3]];const lc=i=>t.lineCols?t.lineCols[i]:'var(--line)';
    return `<svg class="pv ${t.cls}" viewBox="0 0 120 58" preserveAspectRatio="xMidYMid slice">
      ${ed.map(([a,b],i)=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${lc(i)}" stroke-width="2.6" stroke-linecap="round"${k==='costura'?' stroke-dasharray="6 3"':''}/>`).join('')}
      ${pts.map((p,i)=>`<g transform="translate(${p[0]} ${p[1]})"${t.cols?` color="${t.cols[i]}"`:''}><svg x="-9" y="-9" width="18" height="18" viewBox="-10 -10 20 20" overflow="visible">${t.sym}</svg></g>`).join('')}</svg>`;},
  info:d=>`${DIFFS[d].n[0]}–${DIFFS[d].n[1]} puntos · ${DIFFS[d].deg.toString().replace('.',',')} líneas por punto`,
  limit:d=>DIFFS[d].time,
  end:S=>({title:'¡Desenredado!',big:'✓',note:`${S.moves} ${S.moves===1?'movida':'movidas'}.`}),
  keys:{Tab:e=>{e.preventDefault();kbSelect(e.shiftKey?-1:1);},Escape:()=>{kbEnd();sel=-1;if(S)paint();}}
});
// las flechas se repiten al mantenerlas apretadas
Input.keys({ArrowLeft:e=>kbMove(-1,0,e),ArrowRight:e=>kbMove(1,0,e),ArrowUp:e=>kbMove(0,-1,e),ArrowDown:e=>kbMove(0,1,e)});
addEventListener('keyup',e=>{if(e.key.startsWith('Arrow')&&kbFrom){kbEnd();save();paint();}});
</script>
