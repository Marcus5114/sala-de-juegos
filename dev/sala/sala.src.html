<title>Sala de Juegos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: encabezado con pestañas, mosaico de juegos que se adapta de 2 columnas (celular) a 5 (escritorio) */
:root{
  --bg:#f1f1f2; --surface:#ffffff; --fg:#18181a; --muted:#6c6c72; --line:#dcdce0; --chip:#e6e6e9;
  --star:#e0a100; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --font:Montserrat,Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1d1d20; --fg:#ededef; --muted:#9b9ba2; --line:#2e2e33; --chip:#2a2a2f;
  --star:#f2b84b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1d1d20; --fg:#ededef; --muted:#9b9ba2; --line:#2e2e33; --chip:#2a2a2f;
  --star:#f2b84b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.count{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);font:700 .82rem var(--font);height:36px;padding:0 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .n{font-size:.7rem;background:var(--chip);color:var(--muted);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .n{background:var(--fg);color:var(--surface)}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 .8rem var(--font);height:36px;padding:0 14px;border-radius:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
.cat .n{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.zero{color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.cat[aria-pressed="true"] .n{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
  text-decoration:none;color:inherit;transition:transform .15s cubic-bezier(.22,.61,.36,1)}
.tile:active{transform:scale(.97)}
.logo{aspect-ratio:1;max-width:100%;display:block}
.logo svg{width:100%;height:100%;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-weight:800;font-size:.95rem;line-height:1.15;text-wrap:balance}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.live{font-size:.62rem;font-weight:700;color:var(--fg);background:var(--chip);border-radius:8px;padding:2px 7px}
.star{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(0,0,0,.28);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.star[aria-pressed="true"]{background:#fff;color:var(--star)}
.star[aria-pressed="true"] svg{fill:currentColor}
.tile.featured{box-shadow:var(--shadow),0 0 0 2px var(--star)}
.soon{border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);text-align:center;padding:16px;min-height:200px;font-size:.8rem;font-weight:700}
.soon b{font-size:1.6rem;line-height:1;font-weight:400}
.empty{grid-column:1/-1;background:var(--surface);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.5;box-shadow:var(--shadow)}
.empty strong{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
.empty svg{width:20px;height:20px;vertical-align:-4px;fill:none;stroke:var(--star);stroke-width:2;stroke-linejoin:round}
.ttl{display:flex;align-items:center;gap:10px}
.modo{border:1px solid var(--line);background:var(--surface);color:var(--fg);height:30px;padding:0 11px 0 8px;border-radius:15px;font:700 .72rem var(--font);display:flex;align-items:center;gap:5px;cursor:pointer}
.modo svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.foot{display:flex;justify-content:center;padding-top:8px}
.ver{border:0;background:transparent;color:var(--muted);font:600 .75rem var(--font);padding:10px 12px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.ver:hover{color:var(--fg)}
.ver u{text-underline-offset:3px}
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--fg);width:min(520px,calc(100% - 32px));max-height:80vh;box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;max-height:80vh}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.1rem;font-weight:800}
.x{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.log{overflow-y:auto;padding:6px 20px 18px}
.rel{padding:14px 0;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel h3{margin:0 0 6px;font-size:.95rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rel h3 span{font-size:.72rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.rel ul{margin:0;padding-left:18px;font-size:.85rem;line-height:1.5;color:var(--fg)}
.rel li{margin:2px 0}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="ttl"><h1>Sala de Juegos</h1><button class="modo" id="modoBtn" type="button"></button><button class="modo" id="fxBtn" type="button" role="switch"></button></div>
      <div class="count" id="count"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Filtrar juegos">
      <button class="tab" role="tab" id="tab-all" data-view="all">Todos <span class="n" id="nAll"></span></button>
      <button class="tab" role="tab" id="tab-fav" data-view="fav">Destacados <span class="n" id="nFav"></span></button>
    </nav>
  </header>
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer class="foot"><button class="ver" id="verBtn" type="button"></button></footer>
</div>
<dialog id="changelog" aria-labelledby="clTitle">
  <div class="dlg">
    <div class="dh"><h2 id="clTitle">Novedades</h2><button class="x" type="button" id="clClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="log" id="clList"></div>
  </div>
</dialog>

const CHANGELOG=[
  {version:'3.6.0',date:'2026-11-09',items:['Nuevo juego: Blackjack en formato torneo. Jugás contra dos rivales manejados por la computadora (novato, prolija y contador de cartas), que piensan en segundo plano sin trabar la pantalla.','Blackjack: en Libre, el consejo calcula cuánto vale cada jugada con las cartas que faltan salir; podés deshacer. La dificultad endurece las reglas de la casa y mejora a los rivales.','Fondos animados en todos los juegos, según el tema: estrellas, burbujas, hojas, nieve, garabatos, destellos, engranajes, chispas y más. Se mueven sin gastar procesador y se quedan quietos con la batería baja o si el teléfono pide menos movimiento.','Nuevo botón Fondos en la sala (y Fondo animado en el panel de temas de cada juego) para dejarlos quietos.','Movimiento común: cada nivel entra con un resorte suave, los números del marcador reaccionan al cambiar y los botones se hunden al tocarlos.']},
  {version:'3.5.0',date:'2026-11-09',items:['Nuevo juego: Crucigrama, con las pistas dentro del tablero como en los autodefinidos. Más de 900 palabras con definiciones propias, verificadas con el diccionario; niveles sin fin en cuatro dificultades.','Teclado en pantalla con Ñ y también teclado físico: las letras escriben, las flechas mueven, Espacio cambia de dirección y Tab pasa de palabra.','Libre marca cada palabra completa y la pista revela una letra; Desafío va contra reloj y sin marcas.','Cinco temas: Diario, Revista, Cuaderno, Pizarra y Noche. En tablet y computadora las pistas se leen en el mismo tablero.','En todos los juegos con el kit, Ctrl+Z también deshace.']},
  {version:'3.4.0',date:'2026-11-08',items:['Teclado en Pirámide, Puentes, Cartógrafo, Engranajes, Desenredo y Encastre: Z deshace, R reinicia, H da una pista y Enter pasa de nivel; cada juego suma sus teclas (están en Cómo se juega).','Sonido opcional y suave, apagado de entrada: se prende en el panel de temas de cada juego y vale para toda la sala.','Festejo con papelitos al resolver un nivel (se omite si el teléfono pide reducir el movimiento).','Engranajes: el marcador muestra las rpm del motor y de la salida sin cortarse.','Encastre: las piezas rebotan al apoyarlas, las líneas se borran en cascada y avisa cuando superás tu récord.','Desenredo y Cartógrafo: más fluidos en los tableros grandes; solo se redibuja lo que cambia.']},
  {version:'3.3.0',date:'2026-11-08',items:['Cinco juegos nuevos, todos con Libre y Desafío, cuatro dificultades, temas, pistas y guardado automático.','Encastre: acomodá piezas en un tablero de 8×8 y completá filas y columnas.','Pirámide: cada ladrillo es la suma de los dos de abajo; completá los que faltan.','Puentes: uní las islas con puentes horizontales o verticales según sus números, sin cruces.','Cartógrafo: pintá el mapa sin que dos regiones vecinas compartan color.','Engranajes: llevá el giro del motor hasta la salida con el sentido y la velocidad (en rpm) que pide; los dientes se intercalan como en una máquina real y una flecha gira alrededor de la salida mostrando lo que hace falta.']},
  {version:'3.2.0',date:'2026-11-07',items:['Juego nuevo: Desenredo. Puntos unidos por líneas que se cruzan: hay que moverlos hasta que ninguna línea cruce a otra.','Cuatro dificultades según la cantidad de puntos y de líneas por punto; niveles sin fin, todos con solución.','Modo Libre con pistas y Desafío contra reloj con estrellas.','Temas Clásico, Constelación, Botones, Circuito y Metro.']},
  {version:'3.1.0',date:'2026-11-07',items:['Modo oscuro en toda la sala: Auto (sigue al teléfono), Claro u Oscuro.','Se elige con el botón junto al título de la sala o en el panel de colores y temas de cada juego; vale para todos los juegos.','2048 (Números) y Buscaminas (Clásico) tienen tablero oscuro en modo oscuro.','Rueda de Palabras: ahora se eligen las letras de la rueda (de 4 a 8) y el tipo de palabras (comunes o difíciles), con 902 niveles nuevos y avance propio en cada combinación. Se elige tocando el nivel.','Rueda de Palabras: en el tema Bosque la rueda es una flor y cada letra es un pétalo; no se tocan aunque haya 7 u 8 letras.','Rueda de Palabras: fondos con movimiento suave en cada tema: hojas de otoño que caen, algunas llevadas por el viento (Bosque), reflejos suaves de pileta y burbujas transparentes con destellos de colores en el borde (Mar), más de 20 garabatos que tiemblan como dibujados a mano (Cuaderno y Pizarra) y un cielo que gira en arco con estrellas que titilan y una luna (Atardecer). Si el teléfono tiene activado reducir movimiento, quedan quietos.','Rueda de Palabras: con el celular acostado, el crucigrama va a la izquierda y la rueda a la derecha, sin taparse.','Rueda de Palabras: menos plurales; ninguna rueda se arma sobre un plural y cada crucigrama tiene como mucho uno. Los plurales siguen valiendo como palabras extra.','Rueda de Palabras: todas las palabras, del crucigrama y extras, están verificadas con el diccionario ortográfico de español (general y de Argentina), y ahora hay palabras con Ñ.','Rueda de Palabras: las palabras extra encontradas se ven en una tira arriba del crucigrama; si repetís una, se resalta. Tocándola se abre la lista completa.']},
  {version:'3.0.1',date:'2026-11-07',items:['Mejor contraste en todas las paletas: cada ficha, pieza, auto y carta se distingue del fondo y de sus vecinas.','2048: fondos nuevos en Frutas, Espacio y Animales para que ningún dibujo se pierda (el pato y el cisne ya no quedan blanco sobre blanco); en Números, 128 a 2048 tienen colores distintos.','Buscaminas: en Clásico, las casillas tapadas son más oscuras y se distinguen mejor de las abiertas.','Buscaminas: banderas y minas más visibles en Jardín, Playa, Espacio y Nieve; números más oscuros donde faltaba contraste.','Bloques, Rueda de Palabras, Atasco, Cinco Letras y Spider: ajuste de colores en las paletas con poco contraste.']},
  {version:'3.0.0',date:'2026-11-07',items:['Cuatro juegos nuevos, todos con modo Libre y modo Desafío y temas que cambian colores y objetos.','2048: deshacer sin límite en Libre; tres minutos contrarreloj en Desafío. Temas Números, Frutas, Espacio y Animales.','Buscaminas: tres tamaños, 3 vidas en Libre, una vida y cronómetro con récords en Desafío. Temas con minas y banderas propias.','Bloques: piezas que caen; velocidad fija y sin fin en Libre, niveles y récord en Desafío. Bloques de caramelo, madera, neón y gemas.','Rueda de Palabras: 300 niveles de crucigrama con palabras extra; pistas sin límite en Libre, reloj y 3 pistas en Desafío.']},
  {version:'2.9.0',date:'2026-11-06',items:['Atasco: modo Libre, sin contar movimientos ni estrellas; se elige junto a la dificultad.']},
  {version:'2.8.0',date:'2026-11-06',items:['Cinco Letras: modos de 7 y 9 letras, cada uno con palabra diaria, modo libre y estadísticas propias.','Cinco Letras: las listas de 7 y 9 letras se descargan la primera vez que se elige ese largo.']},
  {version:'2.7.0',date:'2026-11-06',items:['Nuevo juego: Cinco Letras, adiviná la palabra en seis intentos.','Cinco Letras: palabra diaria y modo libre, 594 respuestas y más de 10.000 palabras válidas en español, con Ñ.','Cinco Letras: estadísticas por modo, resultado para compartir y cuatro paletas, una pensada para daltonismo.']},
  {version:'2.6.0',date:'2026-11-05',items:['Atasco: 400 niveles nuevos con obstáculos fijos, 100 por dificultad; ahora son 1600.','Atasco: el obstáculo cambia con la paleta: maceta, columna, farola, cono, bloque o cactus.']},
  {version:'2.5.2',date:'2026-11-05',items:['Atasco: portada e ícono de acceso directo con los autos y camiones nuevos.']},
  {version:'2.5.1',date:'2026-11-05',items:['La app muestra la última versión apenas se abre con conexión; sin conexión sigue funcionando con la copia guardada.','Atasco: el cartel de nivel resuelto ya no aparece corrido ni fuera de la pantalla.']},
  {version:'2.5.0',date:'2026-11-05',items:['Atasco: autos y camiones dibujados vistos desde arriba, con parabrisas, faros, luces traseras y espejos.','Atasco: seis paletas de colores (Ciudad, Grises, Noche, Hormigón, Juguete y Desierto), desde el botón de colores.']},
  {version:'2.4.1',date:'2026-11-05',items:['Nuevo ícono de la app: una pila de cajas de juegos de mesa.']},
  {version:'2.4.0',date:'2026-11-05',items:['Número de versión al pie del menú y esta lista de novedades.']},
  {version:'2.3.0',date:'2026-11-05',items:['Atasco: 1200 niveles, 300 por dificultad, con su mínimo verificado.','Atasco: cada nivel nuevo sale al azar de la dificultad elegida y no se repite hasta resolverlos todos.','Atasco: estadísticas por dificultad (resueltos y con 3 estrellas).']},
  {version:'2.2.0',date:'2026-11-05',items:['Atasco: dificultades Fácil, Media, Difícil y Experto.','Atasco: el progreso se guarda por tablero.']},
  {version:'2.1.0',date:'2026-11-05',items:['Categorías en el menú: Cartas, Puzzle, Arcade, Palabras y Estrategia.','Nuevo juego: Atasco, un puzzle de deslizar autos para liberar la salida.']},
  {version:'2.0.0',date:'2026-11-05',items:['La app pasa a ser la Sala de Juegos, con menú en mosaico.','Juegos destacados con estrella: van primero y en su propia pestaña.','Aviso de partida en curso en cada juego.']},
  {version:'1.3.0',date:'2026-11-03',items:['Spider: solo reparte manos con solución verificada, en las tres dificultades.','Spider: la partida en curso se guarda al salir y se retoma al volver.','Spider: las pilas se mueven en bloque y todas las animaciones frenan suave.']},
  {version:'1.2.0',date:'2026-10-30',items:['Spider: todos los movimientos de cartas animados.','Spider: Deshacer a la izquierda y Reiniciar a la derecha.']},

  {version:'1.0.0',date:'2026-10-29',items:['Spider Solitario instalable y sin conexión: 1, 2 o 4 palos, mesa de fieltro, música, ranking y colores a elección.']}

  claro:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  oscuro:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
if(!window.__salaModo)window.__salaModo=m=>{const r=document.documentElement;if(m==='claro')r.setAttribute('data-theme','light');else if(m==='oscuro')r.setAttribute('data-theme','dark');else r.removeAttribute('data-theme');dispatchEvent(new Event('salamodo'));};
const getModo=()=>{try{return localStorage.getItem('sala.modo')||'auto';}catch(e){return 'auto';}};
function paintModo(){const m=getModo(),b=$('modoBtn');b.innerHTML=MODO_I[m]+MODO_N[m];b.setAttribute('aria-label',`Modo de color: ${MODO_N[m]}. Tocá para cambiar.`);
  b.title=m==='auto'?'Sigue el modo del teléfono':'Modo '+MODO_N[m].toLowerCase()+' en todos los juegos';}
$('fxBtn').addEventListener('click',()=>{try{localStorage.setItem('sala.fondos',getFx()?'0':'1');}catch(e){}paintFx();});paintFx();
$('modoBtn').addEventListener('click',()=>{const m=MODOS[(MODOS.indexOf(getModo())+1)%3];try{localStorage.setItem('sala.modo',m);}catch(e){}__salaModo(m);});
addEventListener('salamodo',paintModo);__salaModo(getModo());
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';
function inProgress(g){try{return !!(g.saveKey&&localStorage.getItem(g.saveKey));}catch(e){return false;}}
function render(){
  const isFav=g=>favs.includes(g.id);
  // destacados primero (en el orden en que se marcaron), después el resto por nombre
  let list=GAMES.slice().sort((a,b)=>(isFav(b)-isFav(a))||(isFav(a)?favs.indexOf(a.id)-favs.indexOf(b.id):a.name.localeCompare(b.name,'es')));
  if(view==='fav')list=list.filter(isFav);
  if(cat!=='all')list=list.filter(g=>g.cat===cat);
  // chips de categorías, con la cantidad de juegos de cada una según la pestaña
  const base=view==='fav'?GAMES.filter(isFav):GAMES;
  $('cats').innerHTML=`<button class="cat" data-cat="all" aria-pressed="${cat==='all'}">Todas <span class="n">${base.length}</span></button>`+
    CATEGORIES.map(c=>{const n=base.filter(g=>g.cat===c.id).length;return `<button class="cat${n?'':' zero'}" data-cat="${c.id}" aria-pressed="${cat===c.id}">${c.name} <span class="n">${n}</span></button>`;}).join('');
  $('nAll').textContent=GAMES.length;$('nFav').textContent=favs.length;
  $('count').textContent=GAMES.length+(GAMES.length===1?' juego':' juegos');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===view));
  let h=list.map(g=>`<a class="tile${isFav(g)?' featured':''}" href="${g.href}" data-id="${g.id}">
      <span class="logo">${g.logo}</span>
      <span class="info"><span class="name">${g.name}</span>
        <span class="meta"><span class="tag">${catName(g.cat)}</span>${inProgress(g)?'<span class="live">En curso</span>':''}</span></span>
      <button class="star" type="button" data-star="${g.id}" aria-pressed="${isFav(g)}" aria-label="${isFav(g)?'Quitar de destacados':'Destacar'} ${g.name}">${STAR}</button>
    </a>`).join('');
  if(!list.length){
    if(view==='fav'&&!favs.length)h=`<div class="empty"><strong>Todavía no destacaste ningún juego</strong>Tocá la estrella ${STAR} de un juego para tenerlo acá y primero en la lista.</div>`;
    else if(view==='fav')h=`<div class="empty"><strong>No hay destacados en ${catName(cat)}</strong>Probá con otra categoría o con la pestaña Todos.</div>`;
    else h=`<div class="empty"><strong>Todavía no hay juegos de ${catName(cat)}</strong>Van a aparecer acá cuando se sumen a la sala.</div>`;
  }
  if(view==='all'&&cat==='all')h+='<div class="soon" aria-hidden="true"><b>+</b>Próximamente</div>';
  $('grid').innerHTML=h;
}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-star]');if(!b)return;
  e.preventDefault();e.stopPropagation();
  const id=b.dataset.star;
  favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
  store.set('favs',favs);render();
});
$('cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;store.set('cat',cat);render();});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{view=t.dataset.view;store.set('view',view);render();}));
addEventListener('pageshow',render);
const fmtDate=s=>{const [y,m,d]=s.split('-');return `${+d}/${+m}/${y}`;};
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('verBtn').innerHTML=`Versión ${VERSION} · <u>Novedades</u>`;
$('verBtn').onclick=()=>{
  $('clList').innerHTML=CHANGELOG.map(r=>`<section class="rel"><h3>${r.version}<span>${fmtDate(r.date)}</span></h3><ul>${r.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></section>`).join('');
  $('changelog').showModal();
};
$('clClose').onclick=()=>$('changelog').close();
$('changelog').addEventListener('click',e=>{if(e.target===$('changelog'))$('changelog').close();}); // tocar fuera cierra // al volver de un juego, actualizar "En curso"
render();
</script>
