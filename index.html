ro.","Rueda de Palabras: ahora se eligen las letras de la rueda (de 4 a 8) y el tipo de palabras (comunes o difíciles), con 902 niveles nuevos y avance propio en cada combinación. Se elige tocando el nivel.","Rueda de Palabras: en el tema Bosque la rueda es una flor y cada letra es un pétalo; no se tocan aunque haya 7 u 8 letras.","Rueda de Palabras: fondos con movimiento suave en cada tema: hojas de otoño que caen, algunas llevadas por el viento (Bosque), reflejos suaves de pileta y burbujas transparentes con destellos de colores en el borde (Mar), más de 20 garabatos que tiemblan como dibujados a mano (Cuaderno y Pizarra) y un cielo que gira en arco con estrellas que titilan y una luna (Atardecer). Si el teléfono tiene activado reducir movimiento, quedan quietos.","Rueda de Palabras: con el celular acostado, el crucigrama va a la izquierda y la rueda a la derecha, sin taparse.","Rueda de Palabras: menos plurales; ninguna rueda se arma sobre un plural y cada crucigrama tiene como mucho uno. Los plurales siguen valiendo como palabras extra.","Rueda de Palabras: todas las palabras, del crucigrama y extras, están verificadas con el diccionario ortográfico de español (general y de Argentina), y ahora hay palabras con Ñ.","Rueda de Palabras: las palabras extra encontradas se ven en una tira arriba del crucigrama; si repetís una, se resalta. Tocándola se abre la lista completa."]},{version:"3.0.1",date:"2026-11-07",items:["Mejor contraste en todas las paletas: cada ficha, pieza, auto y carta se distingue del fondo y de sus vecinas.","2048: fondos nuevos en Frutas, Espacio y Animales para que ningún dibujo se pierda (el pato y el cisne ya no quedan blanco sobre blanco); en Números, 128 a 2048 tienen colores distintos.","Buscaminas: en Clásico, las casillas tapadas son más oscuras y se distinguen mejor de las abiertas.","Buscaminas: banderas y minas más visibles en Jardín, Playa, Espacio y Nieve; números más oscuros donde faltaba contraste.","Bloques, Rueda de Palabras, Atasco, Cinco Letras y Spider: ajuste de colores en las paletas con poco contraste."]},{version:"3.0.0",date:"2026-11-07",items:["Cuatro juegos nuevos, todos con modo Libre y modo Desafío y temas que cambian colores y objetos.","2048: deshacer sin límite en Libre; tres minutos contrarreloj en Desafío. Temas Números, Frutas, Espacio y Animales.","Buscaminas: tres tamaños, 3 vidas en Libre, una vida y cronómetro con récords en Desafío. Temas con minas y banderas propias.","Bloques: piezas que caen; velocidad fija y sin fin en Libre, niveles y récord en Desafío. Bloques de caramelo, madera, neón y gemas.","Rueda de Palabras: 300 niveles de crucigrama con palabras extra; pistas sin límite en Libre, reloj y 3 pistas en Desafío."]},{version:"2.9.0",date:"2026-11-06",items:["Atasco: modo Libre, sin contar movimientos ni estrellas; se elige junto a la dificultad."]},{version:"2.8.0",date:"2026-11-06",items:["Cinco Letras: modos de 7 y 9 letras, cada uno con palabra diaria, modo libre y estadísticas propias.","Cinco Letras: las listas de 7 y 9 letras se descargan la primera vez que se elige ese largo."]},{version:"2.7.0",date:"2026-11-06",items:["Nuevo juego: Cinco Letras, adiviná la palabra en seis intentos.","Cinco Letras: palabra diaria y modo libre, 594 respuestas y más de 10.000 palabras válidas en español, con Ñ.","Cinco Letras: estadísticas por modo, resultado para compartir y cuatro paletas, una pensada para daltonismo."]},{version:"2.6.0",date:"2026-11-05",items:["Atasco: 400 niveles nuevos con obstáculos fijos, 100 por dificultad; ahora son 1600.","Atasco: el obstáculo cambia con la paleta: maceta, columna, farola, cono, bloque o cactus."]},{version:"2.5.2",date:"2026-11-05",items:["Atasco: portada e ícono de acceso directo con los autos y camiones nuevos."]},{version:"2.5.1",date:"2026-11-05",items:["La app muestra la última versión apenas se abre con conexión; sin conexión sigue funcionando con la copia guardada.","Atasco: el cartel de nivel resuelto ya no aparece corrido ni fuera de la pantalla."]},{version:"2.5.0",date:"2026-11-05",items:["Atasco: autos y camiones dibujados vistos desde arriba, con parabrisas, faros, luces traseras y espejos.","Atasco: seis paletas de colores (Ciudad, Grises, Noche, Hormigón, Juguete y Desierto), desde el botón de colores."]},{version:"2.4.1",date:"2026-11-05",items:["Nuevo ícono de la app: una pila de cajas de juegos de mesa."]},{version:"2.4.0",date:"2026-11-05",items:["Número de versión al pie del menú y esta lista de novedades."]},{version:"2.3.0",date:"2026-11-05",items:["Atasco: 1200 niveles, 300 por dificultad, con su mínimo verificado.","Atasco: cada nivel nuevo sale al azar de la dificultad elegida y no se repite hasta resolverlos todos.","Atasco: estadísticas por dificultad (resueltos y con 3 estrellas)."]},{version:"2.2.0",date:"2026-11-05",items:["Atasco: dificultades Fácil, Media, Difícil y Experto.","Atasco: el progreso se guarda por tablero."]},{version:"2.1.0",date:"2026-11-05",items:["Categorías en el menú: Cartas, Puzzle, Arcade, Palabras y Estrategia.","Nuevo juego: Atasco, un puzzle de deslizar autos para liberar la salida."]},{version:"2.0.0",date:"2026-11-05",items:["La app pasa a ser la Sala de Juegos, con menú en mosaico.","Juegos destacados con estrella: van primero y en su propia pestaña.","Aviso de partida en curso en cada juego."]},{version:"1.3.0",date:"2026-11-03",items:["Spider: solo reparte manos con solución verificada, en las tres dificultades.","Spider: la partida en curso se guarda al salir y se retoma al volver.","Spider: las pilas se mueven en bloque y todas las animaciones frenan suave."]},{version:"1.2.0",date:"2026-10-30",items:["Spider: todos los movimientos de cartas animados.","Spider: Deshacer a la izquierda y Reiniciar a la derecha."]},{version:"1.1.0",date:"2026-10-30",items:["Menos consumo de batería y datos: el audio se apaga en reposo y los íconos pesan 20 veces menos.","Dibujo de cartas 25 veces más rápido."]},{version:"1.0.0",date:"2026-10
